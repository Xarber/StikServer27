name: Build desktop app

on:
  push:
    branches: [main]
    paths:
      - battery-history.mjs
      - desktop/**
      - discovery.mjs
      - electron-builder.config.cjs
      - build/**
      - native/**
      - native-manager.mjs
      - package.json
      - package-lock.json
      - public/**
      - server.mjs
      - .github/workflows/build-desktop.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            artifact: StikServer-macOS
            package: dist/*.zip
          - runner: windows-latest
            artifact: StikServer-Windows
            package: dist/*.exe
          - runner: ubuntu-latest
            artifact: StikServer-Linux
            package: dist/*.AppImage
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          shared-key: desktop-${{ runner.os }}
      - name: Build native device backend
        run: cargo build --release --manifest-path native/Cargo.toml
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Package StikServer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist
      - name: Verify bundled device runtime
        shell: bash
        run: |
          native_count=$(find dist -type f \( -name stikserver-native -o -name stikserver-native.exe \) | wc -l | tr -d ' ')
          ffmpeg_count=$(find dist -type f \( -name ffmpeg -o -name ffmpeg.exe \) | wc -l | tr -d ' ')
          test "$native_count" -gt 0
          test "$ffmpeg_count" -gt 0
      - name: Verify macOS identity and local-network metadata
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app_path=$(find dist -type d -name StikServer.app -print -quit)
          test -n "$app_path"
          test "$(plutil -extract CFBundleIdentifier raw "$app_path/Contents/Info.plist")" = "com.xarber.stikserver"
          test "$(plutil -extract NSBonjourServices.0 raw "$app_path/Contents/Info.plist")" = "_remotepairing._tcp"
          plutil -extract NSLocalNetworkUsageDescription raw "$app_path/Contents/Info.plist" | grep -q StikServer
          icon_name=$(plutil -extract CFBundleIconFile raw "$app_path/Contents/Info.plist")
          test "$icon_name" != "electron.icns"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign -dvv "$app_path" 2>&1 | grep -q 'Identifier=com.xarber.stikserver'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.package }}
          if-no-files-found: error
