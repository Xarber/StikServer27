[package]
name = "stikserver-native"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
idevice = { git = "https://github.com/jkcoxson/idevice.git", rev = "d32c8189c51c2789496b0768039419c3705498c3", default-features = false, features = ["aws-lc", "condition_inducer", "core_device", "device_info", "diagnostics_relay", "display_stream", "dvt", "location_simulation", "remote_pairing", "rsd", "springboardservices", "sysmontap", "tcp", "tunnel_tcp_stack"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
