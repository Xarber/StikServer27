name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run check
      - run: npm test

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: cargo fmt --manifest-path native/Cargo.toml --check
      - name: Check native backend
        shell: bash
        run: |
          set -o pipefail
          if ! output=$(cargo check --manifest-path native/Cargo.toml 2>&1); then
            printf '%s\n' "$output"
            output=${output//'%'/'%25'}
            output=${output//$'\n'/'%0A'}
            output=${output//$'\r'/'%0D'}
            echo "::error title=Native backend failed to compile::$output"
            exit 1
          fi
          printf '%s\n' "$output"
